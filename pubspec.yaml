name: mi_primera_app
description: "Aplicación móvil para registro de personas con fotos y SQLite en Flutter."
publish_to: "none" # Proyecto privado

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Paquete para selección y captura de fotos con Cámara y Galería
  image_picker: ^1.1.2

  # Base de datos SQLite local para almacenamiento persistente
  sqflite: ^2.3.3+1

  # Acceso a directorios del sistema de archivos (Documentos de la app)
  path_provider: ^2.1.3

  # Utilidades para manipulación de rutas de archivos
  path: ^1.9.0

  # Iconos de Material Design
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/
